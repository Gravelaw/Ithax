name: checks

# Design and action pins: docs/DECISIONS.md, 2026-11-06 · M0, "CI workflow (AKS-73)".

on:
  pull_request:
    # "edited" re-runs the title check when a PR title is changed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# Least privilege: jobs only read the repository. The title job adds pull-requests: read.
permissions:
  contents: read

# One run per ref; a newer run cancels the older one. A title-only edit gets its own
# group, so editing a PR title never cancels the code checks of the same PR.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    github.event.action == 'edited' && !github.event.changes.base && 'title' || 'code' }}
  cancel-in-progress: true

jobs:
  checks:
    # Skipped only for a PR edit that does not change the base branch (title or body edit).
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # The single gate (guide "Test subsets"); CI runs it unchanged.
      - run: bash scripts/check.sh

  benchmarks:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect benchmarks
        id: detect
        run: |
          shopt -s nullglob
          models=(benchmarks/*/model.json)
          if (( ${#models[@]} > 0 )) && [[ -f tests/benchmarks/test_benchmarks.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Found ${#models[@]} benchmark case(s)."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No benchmarks yet (benchmarks/*/model.json and tests/benchmarks/test_benchmarks.py arrive at M2); skipping."
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.detect.outputs.present == 'true'
        run: python -m pip install -e ".[dev]"
      # Benchmarks are gates (guide rule 8). perf is never run in CI.
      - if: steps.detect.outputs.present == 'true'
        run: pytest -m benchmark

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: PR title starts with Linear issue identifiers
        env:
          # Passed through the environment, never interpolated into the script.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^AKS-[0-9]+(, AKS-[0-9]+)*: [^ ]'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title must start with 'AKS-<n>: ' (or 'AKS-<n>, AKS-<m>: ') so Linear links the PR. Got: $TITLE"
            exit 1
          fi
