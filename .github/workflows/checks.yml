name: checks

# Design and action pins: docs/DECISIONS.md, 2026-11-06 · M0, "CI workflow (AKS-73)".

on:
  # Default pull_request types (opened, synchronize, reopened). Title edits are handled by
  # pr-title.yml, so a title edit never publishes a skipped, and so passing, code check.
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# One run per ref; a newer run cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # The single gate (guide "Test subsets"); CI runs it unchanged.
      - run: bash scripts/check.sh

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect benchmarks
        id: detect
        run: |
          shopt -s nullglob
          models=(benchmarks/*/model.json)
          if (( ${#models[@]} > 0 )) && [[ -f tests/benchmarks/test_benchmarks.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Found ${#models[@]} benchmark case(s)."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No benchmarks yet (benchmarks/*/model.json and tests/benchmarks/test_benchmarks.py arrive at M2); skipping."
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.detect.outputs.present == 'true'
        run: python -m pip install -e ".[dev]"
      # Benchmarks are gates (guide rule 8). perf is never run in CI.
      - if: steps.detect.outputs.present == 'true'
        run: pytest -m benchmark


  # The interface (AKS-119; docs/DECISIONS.md, 2026-11-08 · M9). Its gate is `npm run check`
  # (type check, Biome, Vitest), then the end-to-end tests in Chromium against a real
  # service started through the launcher with the built interface. scripts/check.sh stays
  # the Python gate.
  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          LCSIM_PYTHON: python

  # The desktop shell (AKS-142; docs/DECISIONS.md, 2026-11-09 · M11): Tauri's Linux
  # prerequisites, WebKitWebDriver and Xvfb from Ubuntu's archive; the shell built with the
  # Tauri CLI from desktop/package-lock.json and Cargo.lock; its Rust unit tests; then the
  # shell started and driven to Home through tauri-driver (pytest marker desktop, which
  # scripts/check.sh leaves out).
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            desktop/package-lock.json
      - name: Build the interface
        working-directory: ui
        run: |
          npm ci
          npm run build
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Check the shell's format and lints
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the shell and run its unit tests
        working-directory: desktop
        run: |
          npm ci
          npm run build
          npm test
      - run: pytest -m desktop
