<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 08: First-start notice</title>
  <desc id="desc">A dialog shown once on first start: what the tool does, that results are estimates to support judgement, and where the licence is, with a single Continue button.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6773"/>
    </marker>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C3C8D0"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1280" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <!-- Navigation rail: the seven screens of spec 3 -->
  <rect x="0" y="0" width="72" height="800" rx="0" fill="#EEF0F3" stroke="none" stroke-width="1"/>
  <line x1="72" y1="0" x2="72" y2="800" stroke="#D4D8DE" stroke-width="1"/>
  <rect x="0" y="56" width="72" height="56" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <rect x="0" y="56" width="3" height="56" rx="0" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <rect x="26" y="64" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="102" font-family="sans-serif" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle">Home</text>
  <rect x="26" y="128" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="166" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Canvas</text>
  <rect x="26" y="192" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="230" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Data</text>
  <rect x="26" y="256" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="294" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Experiment</text>
  <rect x="26" y="320" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="358" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Run monitor</text>
  <rect x="26" y="384" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="422" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Results</text>
  <rect x="26" y="448" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="486" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Settings</text>
  <!-- Top bar: project, save state, undo/redo, experiment, Run with its reason -->
  <rect x="72" y="0" width="1208" height="48" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <line x1="72" y1="48" x2="1280" y2="48" stroke="#D4D8DE" stroke-width="1"/>
  <text x="92" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Home</text>
  <rect x="0" y="0" width="1280" height="800" rx="0" fill="#000000" stroke="none" stroke-width="1" fill-opacity="0.4"/>
  <!-- Dialog: role=dialog, focus starts on its heading, Continue closes it -->
  <rect x="340" y="160" width="600" height="440" rx="8" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="372" y="212" font-family="sans-serif" font-size="24" font-weight="600" fill="#1B1F24" text-anchor="start">Welcome</text>
  <text x="372" y="252" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">What it does</text>
  <text x="372" y="276" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">Build a model of a process, run it many times, and see where</text>
  <text x="372" y="297" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">the waits and bottlenecks are. No code needed.</text>
  <text x="372" y="348" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Results are estimates</text>
  <text x="372" y="372" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">Results are estimates from a simulation. Use them to</text>
  <text x="372" y="393" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">support your judgement, not to replace it.</text>
  <text x="372" y="444" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Licence</text>
  <text x="372" y="468" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">This is free software under the GNU AGPL version 3. Read the</text>
  <text x="372" y="489" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">licence any time in Settings, About.</text>
  <rect x="788" y="540" width="120" height="36" rx="4" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <text x="848.0" y="563.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Continue</text>
</svg>
