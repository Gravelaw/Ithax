  <title id="title">Wireframe 03: Data</title>
  <desc id="desc">Data screen. Imported files on the left with an Import button. In the centre, the selected file's columns with types and a preview. On the right, the distribution fit for the chosen column: candidates with fitted fields and fit score, and a Use for picker that sets a block setting. Values are examples.</desc>
