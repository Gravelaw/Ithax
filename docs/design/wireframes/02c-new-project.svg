  <text x="372" y="316" font-family="sans-serif" font-size="14" font-weight="600" fill="#34454C" text-anchor="start">What will you model?</text>
  <rect x="372" y="328" width="536" height="56" rx="8" fill="#FDFAF4" stroke="#1C4286" stroke-width="2"/>
  <circle cx="394" cy="356" r="8" fill="#FDFAF4" stroke="#1C4286" stroke-width="2"/>
  <circle cx="394" cy="356" r="4" fill="#1C4286"/>
