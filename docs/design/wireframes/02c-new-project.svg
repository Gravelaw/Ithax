  <!-- Top bar: project, save state, undo/redo, experiment, Run with its reason -->
  <rect x="72" y="0" width="1208" height="48" rx="0" fill="#FDFAF4" stroke="none" stroke-width="1"/>
  <line x1="72" y1="48" x2="1280" y2="48" stroke="#CABD9E" stroke-width="1"/>
  <text x="92" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#34454C" text-anchor="start">Home</text>
  <text x="104" y="96" font-family="sans-serif" font-size="24" font-weight="600" fill="#34454C" text-anchor="start">What would you like to do?</text>
  <rect x="104" y="116" width="376" height="120" rx="8" fill="#FDFAF4" stroke="#6D7E77" stroke-width="1"/>
  <text x="124" y="152" font-family="sans-serif" font-size="20" font-weight="600" fill="#34454C" text-anchor="start">Learn</text>
  <text x="124" y="176" font-family="sans-serif" font-size="14" font-weight="400" fill="#547076" text-anchor="start">Start from a worked example</text>
  <text x="124" y="204" font-family="sans-serif" font-size="13" font-weight="400" fill="#34454C" text-anchor="start">A guided lesson explains each block, then asks you</text>
  <text x="124" y="222" font-family="sans-serif" font-size="13" font-weight="400" fill="#34454C" text-anchor="start">to change something and predict.</text>
  <!-- Build: unavailable until its form exists (M10); aria-disabled, its reason in words below -->
  <rect x="496" y="116" width="376" height="120" rx="8" fill="#F7EEDC" stroke="#6D7E77" stroke-width="1"/>
  <text x="516" y="152" font-family="sans-serif" font-size="20" font-weight="600" fill="#547076" text-anchor="start">Build</text>
  <text x="516" y="176" font-family="sans-serif" font-size="14" font-weight="400" fill="#547076" text-anchor="start">Answer a question of your own</text>
  <text x="516" y="204" font-family="sans-serif" font-size="13" font-weight="400" fill="#547076" text-anchor="start">Two questions pick the closest template; your data</text>
  <text x="516" y="222" font-family="sans-serif" font-size="13" font-weight="400" fill="#547076" text-anchor="start">is optional.</text>
  <text x="496" y="256" font-family="sans-serif" font-size="12" font-weight="400" fill="#547076" text-anchor="start">The Build form needs the templates, and none are installed yet.</text>
  <text x="104" y="300" font-family="sans-serif" font-size="20" font-weight="600" fill="#34454C" text-anchor="start">Templates</text>
  <!-- Empty state of GET /v1/templates, which is [] until M10 -->
  <rect x="104" y="316" width="768" height="64" rx="8" fill="#FDFAF4" stroke="#6D7E77" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="124" y="353" font-family="sans-serif" font-size="14" font-weight="400" fill="#547076" text-anchor="start">No templates are installed yet.</text>
