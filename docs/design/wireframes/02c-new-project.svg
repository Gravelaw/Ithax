  <rect x="912" y="96" width="344" height="680" rx="8" fill="#FDFAF4" stroke="#CABD9E" stroke-width="1"/>
  <text x="928" y="128" font-family="sans-serif" font-size="20" font-weight="600" fill="#34454C" text-anchor="start">Recent projects</text>
