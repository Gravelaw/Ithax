  <rect x="372" y="468" width="536" height="72" rx="8" fill="#F1E5DF" stroke="none" stroke-width="1"/>
  <rect x="372" y="468" width="4" height="72" rx="0" fill="#82241F" stroke="none" stroke-width="1"/>
  <text x="388" y="492" font-family="sans-serif" font-size="14" font-weight="400" fill="#82241F" text-anchor="start">E184 The request field 'name' is empty.</text>
  <text x="388" y="512" font-family="sans-serif" font-size="12" font-weight="400" fill="#82241F" text-anchor="start">Give it at least one character.</text>
  <text x="388" y="530" font-family="sans-serif" font-size="12" font-weight="400" fill="#82241F" text-anchor="start">at /name</text>
  <rect x="684" y="564" width="104" height="36" rx="18" fill="#FDFAF4" stroke="#6D7E77" stroke-width="1"/>
