  <text x="414" y="372" font-family="sans-serif" font-size="12" font-weight="400" fill="#547076" text-anchor="start">Items move through steps.</text>
  <rect x="372" y="396" width="536" height="56" rx="8" fill="#FDFAF4" stroke="#6D7E77" stroke-width="1"/>
  <circle cx="394" cy="424" r="8" fill="#FDFAF4" stroke="#6D7E77" stroke-width="2"/>
  <text x="414" y="420" font-family="sans-serif" font-size="14" font-weight="700" fill="#34454C" text-anchor="start">Plan (decisions and limits)</text>
  <text x="414" y="440" font-family="sans-serif" font-size="12" font-weight="400" fill="#547076" text-anchor="start">Choose the best values within limits.</text>
