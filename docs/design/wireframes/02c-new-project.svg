  <title id="title">Wireframe 02c: Home before the templates, and New empty project</title>
  <desc id="desc">Home as it is until the templates arrive: the Learn entry, the Build entry unavailable with its reason in words, the template gallery's empty state, and recent projects. Over it, the New empty project dialog asks a name and Process (flows and queues) or Plan (decisions and limits), with Cancel and Create; a refusal from the service is shown in the dialog as the service wrote it.</desc>
