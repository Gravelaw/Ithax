<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 01c: Canvas block and port states</title>
  <desc id="desc">Reference sheet of block styles on the canvas: default, selected, keyboard focus, error and warning badges, Learn highlight, a branch with three route ports, port-less resource blocks with dashed reference lines, and the connecting state where valid input ports show a ring.</desc>
