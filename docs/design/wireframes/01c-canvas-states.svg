  <text x="600" y="504" font-family="sans-serif" font-size="13" font-weight="400" fill="#4F5866" text-anchor="start">set in the side panel and cannot be selected on the canvas</text>
  <!-- Connecting state: dragging from an output port; valid input ports get a ring -->
