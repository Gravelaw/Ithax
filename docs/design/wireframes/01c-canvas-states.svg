  <text x="72" y="312" font-family="sans-serif" font-size="14" font-weight="600" fill="#1B1F24" text-anchor="start">till</text>
  <text x="52" y="336" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">server · capacity 1</text>
  <circle cx="40" cy="326.0" r="6" fill="#5F6773" stroke="#5F6773" stroke-width="2"/>
