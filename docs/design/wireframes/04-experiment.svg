<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 04: Experiment</title>
  <desc id="desc">Experiment screen. Experiments listed on the left. For the selected experiment: run length, warm-up, replications, seed, confidence and record interval; a scenarios table with one column per changed parameter; objectives and constraints; and the optional simulation-based search.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6773"/>
    </marker>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C3C8D0"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1280" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <!-- Navigation rail: the seven screens of spec 3 -->
  <rect x="0" y="0" width="72" height="800" rx="0" fill="#EEF0F3" stroke="none" stroke-width="1"/>
  <line x1="72" y1="0" x2="72" y2="800" stroke="#D4D8DE" stroke-width="1"/>
  <rect x="26" y="64" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="102" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Home</text>
  <rect x="26" y="128" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="166" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Canvas</text>
  <rect x="26" y="192" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="230" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Data</text>
  <rect x="0" y="248" width="72" height="56" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <rect x="0" y="248" width="3" height="56" rx="0" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <rect x="26" y="256" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="294" font-family="sans-serif" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle">Experiment</text>
  <rect x="26" y="320" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="358" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Run monitor</text>
  <rect x="26" y="384" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="422" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Results</text>
  <rect x="26" y="448" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="486" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Settings</text>
  <!-- Top bar: project, save state, undo/redo, experiment, Run with its reason -->
  <rect x="72" y="0" width="1208" height="48" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <line x1="72" y1="48" x2="1280" y2="48" stroke="#D4D8DE" stroke-width="1"/>
  <text x="92" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Coffee shop</text>
  <circle cx="262" cy="25" r="5" fill="#1B7332" stroke="none" stroke-width="1"/>
  <text x="274" y="30" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B7332" text-anchor="start">Saved</text>
  <rect x="360" y="10" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="392" y="29" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="middle">Undo</text>
  <rect x="432" y="10" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="464" y="29" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="middle">Redo</text>
  <text x="796" y="30" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Experiment</text>
  <rect x="866" y="10" width="120" height="28" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="876" y="29" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">base</text>
  <text x="974" y="29" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">v</text>
  <rect x="1000" y="8" width="80" height="32" rx="4" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <text x="1040" y="29" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Run</text>
  <rect x="72" y="48" width="208" height="752" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <line x1="280" y1="48" x2="280" y2="800" stroke="#D4D8DE" stroke-width="1"/>
  <text x="88" y="80" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Experiments</text>
  <rect x="88" y="96" width="176" height="36" rx="4" fill="#EEF0F3" stroke="#D4D8DE" stroke-width="1"/>
  <rect x="88" y="96" width="3" height="36" rx="0" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <text x="100" y="119" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">base</text>
  <text x="88" y="160" font-family="sans-serif" font-size="13" font-weight="400" fill="#1D5BBF" text-anchor="start">+ Add experiment</text>
  <text x="304" y="84" font-family="monospace" font-size="24" font-weight="600" fill="#1B1F24" text-anchor="start">base</text>
  <text x="304" y="116" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Run</text>
  <text x="304" y="140" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Run length</text>
  <rect x="304" y="146" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="312" y="166" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">200 h</text>
  <text x="460" y="140" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Warm-up</text>
  <rect x="460" y="146" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="468" y="166" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">10 h</text>
  <text x="460" y="192" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Less than run length</text>
  <text x="616" y="140" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Replications</text>
  <rect x="616" y="146" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="624" y="166" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">30</text>
  <text x="304" y="210" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Seed</text>
  <rect x="304" y="216" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="312" y="236" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">12345</text>
  <text x="304" y="262" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Empty: chosen at random</text>
  <text x="460" y="210" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Confidence</text>
  <rect x="460" y="216" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="468" y="236" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">0.95</text>
  <text x="616" y="210" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Record interval</text>
  <rect x="616" y="216" width="140" height="30" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="624" y="236" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start"></text>
  <text x="616" y="262" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Empty: run length / 200</text>
  <text x="304" y="300" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Scenarios</text>
  <rect x="304" y="312" width="452" height="32" rx="0" fill="#EEF0F3" stroke="none" stroke-width="1"/>
  <text x="316" y="333" font-family="sans-serif" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="start">Scenario</text>
  <text x="504" y="333" font-family="monospace" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="start">tills</text>
  <rect x="304" y="344" width="452" height="32" rx="0" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="316" y="365" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">one_till</text>
  <text x="504" y="365" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">1</text>
  <rect x="304" y="376" width="452" height="32" rx="0" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="316" y="397" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">two_tills</text>
  <text x="504" y="397" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">2</text>
  <text x="304" y="432" font-family="sans-serif" font-size="13" font-weight="400" fill="#1D5BBF" text-anchor="start">+ Add scenario</text>
  <text x="304" y="470" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">With no scenarios the experiment runs the model as written (scenario</text>
  <text x="304" y="488" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">default, spec 1).</text>
  <text x="444" y="432" font-family="sans-serif" font-size="13" font-weight="400" fill="#1D5BBF" text-anchor="start">+ Add parameter column</text>
  <rect x="792" y="64" width="464" height="712" rx="8" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="808" y="96" font-family="sans-serif" font-size="20" font-weight="600" fill="#1B1F24" text-anchor="start">Optimization</text>
  <text x="808" y="124" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Objectives</text>
  <rect x="808" y="136" width="432" height="32" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="820" y="157" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">wait   minimize   till.wait.mean</text>
  <text x="808" y="194" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Constraints</text>
  <rect x="808" y="206" width="432" height="32" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="820" y="227" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">util   till.utilization   &lt;=   0.85</text>
  <text x="808" y="264" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Metric pickers list only metrics spec 2 defines (E174).</text>
  <text x="808" y="304" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Search (simulation-based optimization)</text>
  <rect x="808" y="316" width="20" height="20" rx="3" fill="#1D5BBF" stroke="#6E7682" stroke-width="1"/>
  <path d="M 812 326 L 817 331 L 824 321" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="836" y="331" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">Search for the best parameter values</text>
  <text x="808" y="364" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Objective</text>
  <rect x="808" y="370" width="200" height="30" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="816" y="390" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">wait</text>
  <text x="1024" y="364" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Budget</text>
  <rect x="1024" y="370" width="100" height="30" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="1032" y="390" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">50</text>
  <text x="1140" y="364" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Reps each</text>
  <rect x="1140" y="370" width="100" height="30" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="1148" y="390" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">10</text>
  <text x="808" y="440" font-family="sans-serif" font-size="12" font-weight="600" fill="#4F5866" text-anchor="start">Parameters searched</text>
  <rect x="808" y="448" width="432" height="32" rx="0" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="820" y="469" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">tills   from 1 to 5   (min and max of the parameter)</text>
  <text x="808" y="510" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">The best candidates are re-run with the experiment's</text>
  <text x="808" y="528" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">30 replications before the result is reported (spec 2).</text>
</svg>
