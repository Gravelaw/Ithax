  <title id="title">Wireframe 05: Run monitor</title>
  <desc id="desc">Run monitor. The current run's id, state and a progress bar with the service's message, and Cancel run. Live key numbers are not available (no Phase 1 engine reports them while it runs), which the screen says, so there is no Pause updates button. An inset shows a search run: its message, and that the best-so-far chart and the table of all trials are on Results. Below, the runs of this project with Watch, Cancel and Results.</desc>
