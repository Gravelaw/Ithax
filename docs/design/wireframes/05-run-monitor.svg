  <text x="864" y="176" font-family="sans-serif" font-size="13" font-weight="400" fill="#34454C" text-anchor="start">The message is the service's: "Search, candidate n",</text>
  <text x="864" y="196" font-family="sans-serif" font-size="13" font-weight="400" fill="#34454C" text-anchor="start">then "Confirmation, candidate n".</text>
  <text x="864" y="226" font-family="sans-serif" font-size="13" font-weight="400" fill="#34454C" text-anchor="start">Best so far: the trials are known only when the</text>
  <text x="864" y="246" font-family="sans-serif" font-size="13" font-weight="400" fill="#34454C" text-anchor="start">search is done, so the best-so-far chart and the</text>
  <text x="864" y="266" font-family="sans-serif" font-size="13" font-weight="400" fill="#34454C" text-anchor="start">table of all trials are on Results.</text>
  <rect x="864" y="296" width="140" height="32" rx="4" fill="#1C4286" stroke="none" stroke-width="1"/>
