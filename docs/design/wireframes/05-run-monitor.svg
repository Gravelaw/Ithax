<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 05: Run monitor</title>
  <desc id="desc">Run monitor. The current run's id, state and a progress bar with the service's message, live key numbers updated at most once a second with a Pause updates button, and Cancel run. Below, the run queue and recent runs of this project.</desc>
