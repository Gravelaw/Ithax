      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6773"/>
    </marker>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C3C8D0"/>
    </pattern>
  </defs>
