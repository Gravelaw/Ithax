  <text x="104" y="630" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">At most max_concurrent_runs run at once (default 1, Settings); others wait as</text>
  <text x="104" y="648" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">queued. Runs continue if the window closes; reopening shows progress.</text>
