  <rect x="104" y="296" width="720" height="32" rx="0" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="116" y="317" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">default</text>
  <text x="264" y="317" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">till.wait.mean</text>
  <text x="524" y="317" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">4.5 min</text>
  <rect x="104" y="328" width="720" height="32" rx="0" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="116" y="349" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">default</text>
  <text x="264" y="349" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">till.utilization</text>
  <text x="524" y="349" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">75%</text>
  <text x="104" y="388" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Numbers are estimates while the run goes on; final values and their</text>
  <text x="104" y="406" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">confidence intervals are on the Results screen.</text>
