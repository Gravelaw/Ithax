  <rect x="104" y="262" width="720" height="64" rx="8" fill="#F7EEDC" stroke="#CABD9E" stroke-width="1"/>
  <text x="120" y="288" font-family="sans-serif" font-size="14" font-weight="400" fill="#34454C" text-anchor="start">Live numbers are not available: this engine reports them only when the run is done.</text>
  <text x="120" y="310" font-family="sans-serif" font-size="13" font-weight="400" fill="#547076" text-anchor="start">The averages and their likely ranges are on Results once the run is done.</text>
  <text x="104" y="352" font-family="sans-serif" font-size="12" font-weight="400" fill="#547076" text-anchor="start">No "Pause updates": only the progress bar and its message change while a run goes on.</text>
