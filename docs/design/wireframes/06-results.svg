<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe 06: Results</title>
  <desc id="desc">Results screen for a three-machine line run. Plain-language findings first, then key numbers with confidence intervals, a chart with its data table, the replications and timeseries tables, export to CSV, PDF and project zip, and the footer with model name, run id, fidelity label, replications and confidence, engine name and version, and the sentence: Simulation results are estimates and carry no warranty.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6773"/>
    </marker>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C3C8D0"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1280" height="800" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <!-- Navigation rail: the seven screens of spec 3 -->
  <rect x="0" y="0" width="72" height="800" rx="0" fill="#EEF0F3" stroke="none" stroke-width="1"/>
  <line x1="72" y1="0" x2="72" y2="800" stroke="#D4D8DE" stroke-width="1"/>
  <rect x="26" y="64" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="102" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Home</text>
  <rect x="26" y="128" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="166" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Canvas</text>
  <rect x="26" y="192" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="230" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Data</text>
  <rect x="26" y="256" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="294" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Experiment</text>
  <rect x="26" y="320" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="358" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Run monitor</text>
  <rect x="0" y="376" width="72" height="56" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <rect x="0" y="376" width="3" height="56" rx="0" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <rect x="26" y="384" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="422" font-family="sans-serif" font-size="12" font-weight="600" fill="#1B1F24" text-anchor="middle">Results</text>
  <rect x="26" y="448" width="20" height="20" rx="4" fill="none" stroke="#6E7682" stroke-width="1.5"/>
  <text x="36" y="486" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="middle">Settings</text>
  <!-- Top bar: project, save state, undo/redo, experiment, Run with its reason -->
  <rect x="72" y="0" width="1208" height="48" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
  <line x1="72" y1="48" x2="1280" y2="48" stroke="#D4D8DE" stroke-width="1"/>
  <text x="92" y="30" font-family="sans-serif" font-size="16" font-weight="600" fill="#1B1F24" text-anchor="start">Three-machine line</text>
  <circle cx="262" cy="25" r="5" fill="#1B7332" stroke="none" stroke-width="1"/>
  <text x="274" y="30" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B7332" text-anchor="start">Saved</text>
  <rect x="360" y="10" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="392" y="29" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="middle">Undo</text>
  <rect x="432" y="10" width="64" height="28" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="464" y="29" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="middle">Redo</text>
  <text x="796" y="30" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Experiment</text>
  <rect x="866" y="10" width="120" height="28" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="876" y="29" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">base</text>
  <text x="974" y="29" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">v</text>
  <rect x="1000" y="8" width="80" height="32" rx="4" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <text x="1040" y="29" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Run</text>
  <text x="104" y="88" font-family="sans-serif" font-size="24" font-weight="600" fill="#1B1F24" text-anchor="start">Results</text>
  <rect x="760" y="64" width="108" height="32" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="814.0" y="85.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="middle">Export CSV</text>
  <rect x="876" y="64" width="108" height="32" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="930.0" y="85.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="middle">Export PDF</text>
  <rect x="992" y="64" width="176" height="32" rx="4" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="1080.0" y="85.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="middle">Export project (zip)</text>
  <text x="104" y="128" font-family="sans-serif" font-size="20" font-weight="600" fill="#1B1F24" text-anchor="start">Findings</text>
  <!-- Findings first (spec 3 Screen 6, spec 4 finding rules); text from spec 4 -->
  <rect x="104" y="140" width="1056" height="52" rx="8" fill="#FFF3D6" stroke="#8A5300" stroke-width="1"/>
  <text x="120" y="162" font-family="sans-serif" font-size="13" font-weight="600" fill="#8A5300" text-anchor="start">Bottleneck</text>
  <text x="120" y="182" font-family="sans-serif" font-size="14" font-weight="400" fill="#1B1F24" text-anchor="start">weld is the bottleneck: busy 90% of the time, with an average wait of 17.3 min.</text>
  <rect x="104" y="200" width="1056" height="52" rx="8" fill="#FFFFFF" stroke="#6E7682" stroke-width="1"/>
  <text x="120" y="222" font-family="sans-serif" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="start">Not enough runs</text>
  <text x="120" y="242" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">The estimates for weld.wait.mean are still uncertain: weld.wait.mean is 17.3 min plus or minus 4.4 min. About {n_required} replications would be needed for a 10% interval.</text>
  <text x="104" y="288" font-family="sans-serif" font-size="20" font-weight="600" fill="#1B1F24" text-anchor="start">Key numbers</text>
  <rect x="104" y="300" width="512" height="32" rx="0" fill="#EEF0F3" stroke="none" stroke-width="1"/>
  <text x="116" y="321" font-family="sans-serif" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="start">Metric</text>
  <text x="324" y="321" font-family="sans-serif" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="start">Mean</text>
  <text x="444" y="321" font-family="sans-serif" font-size="13" font-weight="600" fill="#1B1F24" text-anchor="start">95% interval</text>
  <rect x="104" y="332" width="512" height="32" rx="0" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="116" y="353" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">weld.utilization</text>
  <text x="324" y="353" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">90%</text>
  <text x="444" y="353" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">{half-width}</text>
  <rect x="104" y="364" width="512" height="32" rx="0" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="116" y="385" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">weld.wait.mean</text>
  <text x="324" y="385" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">17.3 min</text>
  <text x="444" y="385" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">± 4.4 min</text>
  <rect x="104" y="396" width="512" height="32" rx="0" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="116" y="417" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">exit.throughput</text>
  <text x="324" y="417" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">{value}</text>
  <text x="444" y="417" font-family="sans-serif" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">{half-width}</text>
  <!-- Chart with its data table beside it -->
  <rect x="640" y="288" width="520" height="240" rx="8" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="656" y="316" font-family="sans-serif" font-size="14" font-weight="600" fill="#1B1F24" text-anchor="start">Mean wait by station, with 95% intervals</text>
  <line x1="700" y1="500" x2="1140" y2="500" stroke="#6E7682" stroke-width="1"/>
  <line x1="700" y1="340" x2="700" y2="500" stroke="#6E7682" stroke-width="1"/>
  <rect x="760" y="470" width="48" height="30" rx="0" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <line x1="784" y1="450" x2="784" y2="490" stroke="#1B1F24" stroke-width="1.5"/>
  <text x="784" y="518" font-family="monospace" font-size="12" font-weight="400" fill="#1B1F24" text-anchor="middle">station_a</text>
  <rect x="890" y="380" width="48" height="120" rx="0" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <line x1="914" y1="360" x2="914" y2="400" stroke="#1B1F24" stroke-width="1.5"/>
  <text x="914" y="518" font-family="monospace" font-size="12" font-weight="400" fill="#1B1F24" text-anchor="middle">weld</text>
  <rect x="1020" y="455" width="48" height="45" rx="0" fill="#1D5BBF" stroke="none" stroke-width="1"/>
  <line x1="1044" y1="435" x2="1044" y2="475" stroke="#1B1F24" stroke-width="1.5"/>
  <text x="1044" y="518" font-family="monospace" font-size="12" font-weight="400" fill="#1B1F24" text-anchor="middle">station_c</text>
  <text x="656" y="540" font-family="sans-serif" font-size="12" font-weight="400" fill="#1D5BBF" text-anchor="start">Data table</text>
  <text x="104" y="452" font-family="sans-serif" font-size="20" font-weight="600" fill="#1B1F24" text-anchor="start">Tables</text>
  <rect x="104" y="464" width="120" height="32" rx="4" fill="#EEF0F3" stroke="#D4D8DE" stroke-width="1"/>
  <text x="164" y="485" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="middle">replications</text>
  <rect x="232" y="464" width="120" height="32" rx="4" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="292" y="485" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="middle">timeseries</text>
  <rect x="104" y="504" width="512" height="120" rx="0" fill="#FFFFFF" stroke="#D4D8DE" stroke-width="1"/>
  <text x="116" y="528" font-family="monospace" font-size="13" font-weight="400" fill="#4F5866" text-anchor="start">scenario   replication   metric   value   unit</text>
  <text x="116" y="552" font-family="monospace" font-size="13" font-weight="400" fill="#1B1F24" text-anchor="start">default    0             weld.wait.mean   ...   s</text>
  <text x="104" y="650" font-family="sans-serif" font-size="13" font-weight="400" fill="#1D5BBF" text-anchor="start">Tell us what you built (opens your browser)</text>
  <text x="104" y="690" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Example values: the weld figures are spec 2's prototype reference values; station names and {braced} values are placeholders.</text>
  <!-- Footer on every results page and exported PDF (spec 3 Screen 6) -->
  <rect x="72" y="728" width="1208" height="72" rx="0" fill="#EEF0F3" stroke="none" stroke-width="1"/>
  <line x1="72" y1="728" x2="1280" y2="728" stroke="#D4D8DE" stroke-width="1"/>
  <text x="104" y="752" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Model: Three-machine line  ·  Run: 20261106T101502-K3QX7A  ·  Fidelity: Standard: 30 replications of {length}, 95% confidence  ·  Replications: 30  ·  Confidence: 95%</text>
  <text x="104" y="772" font-family="sans-serif" font-size="12" font-weight="400" fill="#4F5866" text-anchor="start">Engine: {engine name} {engine version}  ·  Simulation results are estimates and carry no warranty.</text>
</svg>
