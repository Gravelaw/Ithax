  <!-- Findings first (spec 3 Screen 6, spec 4 finding rules); text from spec 4 -->
  <rect x="104" y="140" width="1056" height="52" rx="8" fill="#FCEBD1" stroke="#915604" stroke-width="1"/>
  <text x="120" y="162" font-family="sans-serif" font-size="13" font-weight="600" fill="#915604" text-anchor="start">Bottleneck</text>
  <text x="120" y="182" font-family="sans-serif" font-size="14" font-weight="400" fill="#34454C" text-anchor="start">weld is the bottleneck: busy 90% of the time, with an average wait of 17.3 min.</text>
  <rect x="104" y="200" width="1056" height="52" rx="8" fill="#FDFAF4" stroke="#6D7E77" stroke-width="1"/>
  <text x="120" y="222" font-family="sans-serif" font-size="13" font-weight="600" fill="#34454C" text-anchor="start">Not enough runs</text>
  <text x="120" y="242" font-family="sans-serif" font-size="13" font-weight="400" fill="#34454C" text-anchor="start">The estimates for weld.wait.mean are still uncertain: weld.wait.mean is 17.3 min plus or minus 4.4 min. About {n_required} replications would be needed for a 10% interval.</text>
