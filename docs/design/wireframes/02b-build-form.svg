  <text x="688" y="241" font-family="sans-serif" font-size="12" font-weight="400" fill="#547076" text-anchor="end">Machine breakdowns</text>
  <rect x="104" y="264" width="600" height="40" rx="4" fill="#FDFAF4" stroke="#6D7E77" stroke-width="1"/>
  <circle cx="124" cy="284" r="7" fill="#FDFAF4" stroke="#6D7E77" stroke-width="2"/>
