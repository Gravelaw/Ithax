  <title id="title">Wireframe 02b: Build mode form</title>
  <desc id="desc">The fixed Build mode form of spec 4. Step 1 asks what the user wants to find out, with six answers and the template each opens; the optimization answer asks a second question. Step 2 asks whether the user has data. A project name field and Continue.</desc>
