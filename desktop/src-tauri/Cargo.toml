# The Ithax desktop shell (AKS-142; docs/DECISIONS.md, 2026-11-09 · M11). Versions are exact,
# and Cargo.lock pins every crate; Tauri 2.11.1 or later is required (spec 3 "Architecture",
# advisory GHSA-7gmj-67g7-phm9).
[package]
name = "ithax-desktop"
version = "0.0.0"
description = "The Ithax desktop shell"
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
