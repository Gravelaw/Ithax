[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "lcsim"
description = "Low-code simulation, modelling and optimization (working name)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
]

[tool.hatch.version]
path = "src/lcsim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lcsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Specs and the guide are verbatim exports; never reformat them.
extend-exclude = ["docs/specs", "CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
