[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "ithax"
description = "Low-code simulation, modelling and optimization (working name)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.162.1",
    "highspy>=1.15.1,<1.16",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pint>=0.25.3",
    "pyarrow>=26.0.1",
    # Imported directly by ithax.service (request bodies); it was only a transitive
    # dependency of fastapi (#99, P9). The version installed on 2026-11-13.
    "pydantic>=2.14.3",
    "pyomo>=6.10.1",
    "python-multipart>=0.0.33",
    "scipy>=1.17.1",
    "simpy>=4.1.2",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.170.15",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pytest-cov>=7.1",
    "types-jsonschema>=4.26.0.20261006",
    "httpx2>=2.16.0",
]

# Spec 1 "Engine contract": adapters are discovered through this group; the entry-point name
# is the adapter's name, which run.engine refers to.
[project.entry-points."ithax.engines"]
highs = "ithax.engines.optimize.adapter:HighsAdapter"
simpy = "ithax.engines.process.adapter:ProcessAdapter"

[tool.hatch.version]
path = "src/ithax/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ithax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ on the path before plugins load, for the route check under pytest-xdist
# (tests/xdist_routes.py, loaded by `-p xdist_routes` below; #99, P1).
pythonpath = ["tests"]
markers = [
    "benchmark: benchmark with a known answer",
    "benchmark_coverage: 20-seed coverage run, by hand",
    "template: runs a template package against its expected.json",
    "perf: performance measurement",
    "remote: needs an SSH host",
    "cluster: needs a Slurm queue",
    "desktop: drives the built desktop shell through tauri-driver",
    "package: installs the built Linux package in a clean container (after scripts/package_linux.py)",
]
# No coverage flags here, so that the subset commands (pytest tests/model,
# pytest -m benchmark, pytest -m perf) run without failing the coverage threshold.
addopts = "-ra --strict-markers -p xdist_routes -m 'not benchmark_coverage and not perf and not remote and not cluster and not desktop and not package'"
# Warnings are errors (Power of Ten rule 10; docs/retrospective/proposed-agent-setup.md,
# P20; #99). A third-party warning that cannot be fixed here gets its own "ignore:" entry
# with the reason.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Specs and the guide are prose; ruff must not reformat code blocks inside them.
extend-exclude = ["docs/specs", "CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF", "C90", "S102", "S307", "PLW0603", "TID251"]

# Power of Ten rule 4 in spirit, and NPR 7150.2D SWE-220's cap for safety-critical code.
# No function exceeded it on 2026-11-09 (docs/retrospective/proposed-agent-setup.md, P21).
[tool.ruff.lint.mccabe]
max-complexity = 15

# tests/mcp mirrors src/ithax/mcp; without this, isort would take the MCP SDK, `mcp`, for a
# first-party package because `src` lists `tests`.
[tool.ruff.lint.isort]
known-third-party = ["mcp"]

# House helpers (docs/retrospective/proposed-agent-setup.md, P5; #99). Each message says what
# to use instead, so a lint failure carries its own fix.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Randomness only through the spec 1 stream scheme: ithax.model.streams.generator_for."
"numpy.random.seed".msg = "Randomness only through the spec 1 stream scheme: ithax.model.streams.generator_for."
"numpy.random.default_rng".msg = "Randomness only through the spec 1 stream scheme: ithax.model.streams.generator_for."
"json.loads".msg = "Read JSON with ithax.strict_json.read_json: it rejects NaN, infinity and lone surrogates."
"json.load".msg = "Read JSON with ithax.strict_json.read_json_file or read_json_object_file."
"json.dumps".msg = "Write JSON with ithax.strict_json.encode_json (files) or json_text (messages, streams, bodies)."
"json.dump".msg = "Write JSON with ithax.strict_json.encode_json."
"os.replace".msg = "Replace a file with ithax.files.atomic_write or atomic_write_with: one helper, one naming scheme, flushed to disk."
"os.rename".msg = "Replace a file with ithax.files.atomic_write or atomic_write_with: one helper, one naming scheme, flushed to disk."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "TID251"]
# The helpers themselves, and the repository's tools, which are not product code.
"src/ithax/strict_json.py" = ["TID251"]
"src/ithax/files.py" = ["TID251"]
"scripts/**" = ["TID251"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts/package_linux.py", "scripts/hooks"]

# pyarrow 26.0.1 ships no type information (no py.typed, no stubs); pyarrow-stubs follows
# pyarrow 20. Its tables are typed as Any (docs/DECISIONS.md, AKS-97).
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# scipy 1.17.1 and 1.18.1 ship no py.typed; scipy-stubs would be one more dev dependency for
# the one call the experiment manager makes (scipy.stats.t.ppf; docs/DECISIONS.md, AKS-101
# and AKS-102).
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

# openpyxl 3.1.5 ships no py.typed; types-openpyxl would be one more dev dependency for the
# one reader ithax.model.data_files uses, which types what it uses with a Protocol
# (docs/DECISIONS.md, AKS-113).
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

# pyomo 6.10.1 ships no py.typed and has no stubs; only ithax.engines.optimize.solver
# imports it (docs/DECISIONS.md, AKS-108).
[[tool.mypy.overrides]]
module = ["pyomo", "pyomo.*"]
ignore_missing_imports = true

[tool.coverage.run]
# Branches as well as lines (docs/retrospective/proposed-agent-setup.md, P9; #99); the gate in
# scripts/check.sh is 99% of lines and branches combined.
branch = true

[tool.coverage.report]
# `python -m ithax.runs.worker` runs its guarded line only as a script; main() itself is
# tested in process, and the module is run as a real subprocess (tests/runs/test_worker.py).
exclude_also = ['if __name__ == "__main__":']
