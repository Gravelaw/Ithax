[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "lcsim"
description = "Low-code simulation, modelling and optimization (working name)"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "pint>=0.25.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pytest-cov>=7.1",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.hatch.version]
path = "src/lcsim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lcsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: benchmark with a known answer",
    "benchmark_coverage: 20-seed coverage run, by hand",
    "perf: performance measurement",
    "remote: needs an SSH host",
    "cluster: needs a Slurm queue",
]
# No coverage flags here, so that the subset commands (pytest tests/model,
# pytest -m benchmark, pytest -m perf) run without failing the coverage threshold.
addopts = "-ra --strict-markers -m 'not benchmark_coverage and not perf and not remote and not cluster'"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Specs and the guide are prose; ruff must not reformat code blocks inside them.
extend-exclude = ["docs/specs", "CLAUDE.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
